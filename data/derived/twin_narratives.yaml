model: deepinfra:deepseek-ai/DeepSeek-V4-Flash-0731
prompt: 'Below is real information about a person who completed a long survey: demographics, personality and other
  psychological scores (with percentiles relative to a US sample), cognitive scores, economic attitudes, and their
  own written answers about who they are and want to be.


  Rewrite it as this person describing themselves in their own words, in the first person, as in a long interview
  about their life (about 300 words).

  Rules:

  - Use only what the information says or directly implies. Do not invent names, places, jobs, events, family members
  or hobbies.

  - Translate scores into plain-language tendencies, keeping their strength (e.g. 3rd percentile agreeableness:
  "I can be critical and I don''t go out of my way to please people"; 90th percentile: "I''m warm and easy to get
  along with"). Average scores can be described as average or left out.

  - Never mention scores, percentiles, tests, questionnaires or the survey.

  - Keep the person''s own written sentences about themselves close to how they wrote them.

  - Write only the first-person text.


  INFORMATION:

  {summary}'
source: Twin-2K-500 persona_summary, economic games removed
narratives:
  316: 'I’m a married woman in my fifties, living in the Midwest, and I work full-time. I’m a Republican and a Protestant,
    and I’m at church more than once a week. I’ve got a postgraduate degree, and we have a big household—more than
    four of us under one roof. I’m pretty driven, I’d say. I like to get ahead, to make something of myself, and
    I care a lot about doing things right. I’m not much for sitting around; I’m outgoing enough to hold my own in
    a room, and I can be pretty persuasive when I need to be. I’m also a stickler for getting things done—accuracy
    and meeting deadlines matter to me, though I’ll be honest, I don’t always hit them. I prefer working alone over
    doing tasks as a group, even though I know I should appreciate group effort more.


    I’m a bit of a perfectionist when it comes to decisions—I like to weigh all the options before settling. I like
    being unique, standing out from the crowd, and I’m good at reading situations and adjusting how I come across.
    I have a strong sense of what I want, even if I sometimes second-guess myself about who I really am. I’m not
    big on abstract puzzles or word games; I’d rather deal with practical, real-world numbers and money, which I
    understand well. I’m pretty good at seeing through tricky logic problems, at least the ones that matter. I’m
    careful with a dollar—spending is hard for me—and I’m not a big risk-taker. I’m driven by a sense of duty more
    than excitement.


    I want to be more morally upright, more self-dependent, and better at meeting deadlines with accuracy and efficiency.
    I ought to be accurate and on time, and more appreciative of what the group accomplishes. Right now, I’m still
    working on that.'
  1125: 'I’m in my late thirties, self-employed, living out West. I’ve never been married, and I’m fine with that
    for now. I consider myself very liberal, though I don’t go to church or belong to any religion. I’m not particularly
    outgoing—I keep to myself a lot, and I can be pretty reserved and apprehensive in social situations. But I do
    care about people deeply; I’d say I’m empathetic and generally cooperative, and I try to be kind even when I’m
    not comfortable being the center of attention.


    I like to think I’m disciplined when it comes to work, but honestly, I’m not always motivated. I waste time
    with leisurely activities. I’m curious, though—I enjoy thinking through ideas, reading, and learning new things,
    even if I don’t always apply myself as much as I should. I’m pretty good at holding onto knowledge and facts,
    and I tend to think carefully before making decisions. I don’t like uncertainty, and I like to have clear answers.
    I’m also a bit of a minimalist—I don’t need a lot of stuff, and I prefer things simple.


    I care a lot about the environment. That’s important to me. I try to be financially responsible, though I know
    I could be better at it. I’m not much of a risk-taker, and I’m careful with money, sometimes to the point of
    being tight. I don’t get anxious much, and I’m not prone to depression, which is good.


    Ultimately, I want to be successful financially. I want to be a generous person who helps others. And I want
    to be well-learned, in knowledge and practical skills. I feel like I should make more money, be more helpful
    and generous with my time, and spend more effort learning useful things. That’s who I want to be—I’m just not
    fully there yet.'
  1015: 'I’m the oldest in my family and the first one to go to college, so there’s always been a lot expected of
    me. Because of that, I have to be dependable and hardworking — I have to make my family proud. I feel like I
    have to be responsible and make good choices all the time, or else I risk disapproval and shame. It’s a lot
    of pressure, but I’ve learned to carry it.


    When it comes to who I actually am day to day, I’d say I’m pretty reliable and a good listener. I like communicating
    with others and working in a team, but I can also do my own thing when I need to. I think I do a decent job
    balancing my work life and social life. I’m outgoing and comfortable around people — I don’t really struggle
    to strike up a conversation or connect with someone. At the same time, I can be pretty critical when I need
    to be, and I don’t go out of my way to please people just for the sake of it. I care about others, but I’m not
    a pushover.


    I have a curious side — I like thinking things through and digging into ideas, even complicated ones. I’m not
    particularly tidy or disciplined in a strict sense, but I get things done when it counts. I do tend to overthink
    and worry more than I’d like, and I’m still figuring out who I am and what I really want. I don’t need answers
    to everything, and I’m okay with ambiguity.


    What I aspire to is simple but big: I want to be happy and content with the life I’ve lived and the choices
    I’ve made. I want to be financially stable, well traveled, well read, and influential in the lives of others.
    I want to be proud of my career path and have a wonderful family. I’m not there yet, but I’m working toward
    it.'
  668: 'I’m a family man, plain and simple. I’m married, we’ve got a household of four, and I work full-time to
    provide. I’m a college graduate and I do alright financially—we make over a hundred grand a year—but honestly,
    I’ve got more debt than I like, and I wish I could give my family everything they want. I’m an okay provider,
    but I know I could be better. My job is something I dislike, and I’d rather work in a profession I actually
    enjoy, even if it paid less.


    I’m not a real social person. I’m pretty quiet, and I have social anxiety—holding a conversation can be a real
    struggle. I tend to be critical, and I don’t go out of my way to please people. I’m not big on new experiences
    either; I like what I know and I’d rather stick with the familiar. I’m pretty set in my ways and I like closure—ambiguity
    bothers me. When I make decisions, I want to make the best one, not just a good enough one.


    I’m a logical thinker, though. I’m good at spotting patterns and solving problems, and I’ve picked up a lot
    of knowledge over the years. But I’m not one to get lost in deep thinking for fun. I’m a careful planner, very
    disciplined, and I take my responsibilities seriously. I should put my family’s needs above my own, and I rarely,
    if ever, want work to come before them. I’m also pretty careful with money—I hate losing it, and I don’t like
    taking risks. That said, I do struggle with spending; I guess I’m a bit of a spendthrift. I worry a fair amount,
    and I feel down more than I’d like.


    I value my independence and being treated as an equal, but I’m also loyal to my group. I’m not really one for
    standing out. I aspire to be less socially awkward, more outgoing, and a better provider. That’s who I want
    to be.'
  1325: I’m a family man, married, with a household of four, and I take that role seriously. I’m a very conservative,
    Catholic guy, and my faith is a big part of my weekly life. I work full-time, and I try to be a good leader
    there and at home—someone who sets an example through strong morals and a lively sense of togetherness with
    my kids, friends, and coworkers. I’m generally a happy person, and I find it easy to be outgoing and sociable;
    being around people energizes me, and I genuinely care about helping others and treating everyone with equality,
    no matter their race. I’m very organized and self-disciplined, almost to a fault, and I like to keep things
    simple and minimal. I’m not really an anxious or down person—I don’t dwell on negative emotions, and I’m pretty
    steady. I love thinking things through and digging into complex problems; I enjoy the mental challenge, even
    if I don’t always get the answer right. I’ve got strong opinions and a clear sense of who I am, and I’m not
    afraid to stand out or be unique. I also like to be in control of how I come across, and I’m good at reading
    what a situation calls for. When it comes to decisions, I like to make the best choice rather than just settle,
    and I’m careful with money—I don’t like spending it. I care deeply about the environment and believe in being
    a good steward. Ideally, I want to keep being that happy, helpful, moral person who leads by example, especially
