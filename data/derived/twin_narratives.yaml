    That’s who I aim to be, and I think that’s who I am.
  1621: 'I’m a 30-something Hispanic woman living out West, and I never finished college—just high school. I’m not
    married and don’t have kids, and right now I’m unemployed, living with family, and trying to figure things out.
    I’m very liberal and agnostic, and I’ve never been one for church.


    Honestly, I’m an anxious person. I’m afraid to do what needs to be done, and that comes out looking like laziness
    or a lack of ambition. I feel uncoordinated and disorganized, and everyday tasks that seem easy for other people
    feel overwhelming to me. I’m not outgoing at all—I keep to myself and don’t take chances. I struggle with feeling
    like I don’t have a clear sense of who I am, and I tend to doubt myself.


    The person I want to be is someone happier and carefree. I’d love to be outgoing and not afraid to take a chance,
    someone ambitious. I know I should be organized and responsible, able to do normal everyday tasks like everyone
    else, and live my life without fear.


    I’m not really into deep thinking or complex puzzles—I prefer keeping things straightforward. I’m pretty good
    with money, though, and I understand financial stuff well. I also do well with certain types of logic, especially
    when it comes to reasoning through rules and conditions. I’m careful and don’t like taking risks, and I tend
    to want things now rather than later, even if it’s not the smartest choice. I also struggle with spending—I
    have a hard time controlling it, even when I know I shouldn’t.


    I’d like to feel more sure of myself and less weighed down by fear and anxiety, but I’m still working on how
    to get there.'
  1238: 'I’m retired now, and I live in the Midwest with my husband. I’m married, and my faith is important to me,
    even though I don’t go to church. I’m a Democrat and pretty liberal in my views. We get by on what we have;
    money isn’t something I think about a lot, and I’m careful with it. I don’t like taking risks.


    I’m the kind of person who puts others first. I’m a great listener, and I give advice when needed. I go out
    of my way to help out when needed, and I give my loved ones the attention they need at any time. I’m very agreeable
    and easy to get along with, probably more than most. I’m not really one for new ideas or big changes; I like
    things the way they are, and I don''t spend much time pondering deep or complicated questions. I’m not ambitious
    or competitive. I’m pretty calm and steady, not much gets me worked up or anxious.


    When I think about the person I ought to be, I know I shouldn’t complain when my mother-in-law needs me—I’m
    her caregiver. I need to help her out more than I have, and give more of my time to her when she’s doubtful.
    As for who I aspire to be, I really can’t think of much of anything I’d want to aspire to. Maybe I could be
    more of a person who stops whatever I’m doing when someone needs me.'
  1320: 'I’m a Midwestern man, married, with a family, working full-time. I’m the kind of person who likes to be
    around people—I get my energy from being social, and I care a lot about the people in my life. I’m empathetic,
    maybe more than most, and I value my relationships deeply. At the same time, I’m not one to overthink things
    or get lost in abstract ideas. I’d rather keep things simple and straightforward. I like things tidy and uncluttered,
    in my space and in my life.


    But I’ll be honest—I’ve been struggling. I’m tired a lot, and my confidence has taken a hit. I deal with a lot
    of anxiety and some down days. I tend to worry, and I can get stuck in my head about things. I’m not as disciplined
    or organized as I’d like to be, and I admit I’m not much for deep thinking or puzzles. I’m more of a “do what
    I need to do” kind of person right now.


    What I want for myself is to be someone who knows more about the world, someone who’s confident and willing
    to try new things. My big goal is to get out of my comfort zone and explore more. I know I should be more of
    a go-getter, not so afraid of taking on new challenges, and I should surround myself more with the accomplished
    friends I have. I’m not there yet, but I know what I’m aiming for.'
  1114: 'I’m a hard worker, most of the time. I work every moment I can and I barely watch any TV. I normally don’t
    waste time on social media, though unfortunately, there have been times where I’ve wasted days on it—usually
    because something irritated me. I can fall into inert behavior patterns at times, and when something bothers
    me, I can become obsessed with it. I have a tendency to attach to unfavorable events or negative media in a
    way where I start to view the whole world negatively.


    I’m extremely curious and love thinking through complex problems—I can spend hours untangling a logic puzzle
    or a reasoning task. I’m outgoing and enjoy being around people, but I’m also quite self-sufficient and don’t
    really care what others think of me. I can be critical and I don’t go out of my way to please people. I like
    to keep things clear and straightforward, but I’m not someone who needs everything nailed down; I’m comfortable
    with ambiguity. I’m never married, live alone, and I’m fully employed. I’m well-grounded in a lot of knowledge—I’ve
    had a good education—and I’m pretty good at financial matters, though I’m not naturally gifted at brand-new
    kinds of abstract reasoning. I’m careful with money and prefer to avoid risks, though I don’t get too upset
    about losses. I’m someone who keeps a pretty clear sense of who I am.


    I aspire to be more organized. I’m so busy that I often have a lot of clutter in my business and personal life—it
    slows me down. Although it takes time, effort, and consistency, I think it will boost efficiency. I’d like to
    become more proactive and get things done ahead of time. I ought to be a successful person. I graduated from
    a top university with honors, and I come from a highly educated background. I should be more ambitious and strive
    to earn wealth, which I can share with others.'
  595: 'I’m a people person, through and through. I light up around others, and I genuinely care about the people
    in my life. Being kind, considerate, and patient isn’t just something I try to do—it’s who I am. I do my best
    to care for others and respect them, even when we don’t agree. I’m also very organized and self-disciplined.
    I like to get things done and do them well. I’m not one to get easily stressed or anxious; I’m pretty steady
    and calm, even when things get busy. I love a good challenge when it comes to thinking things through. I enjoy
    digging into complicated problems and figuring them out. I’m not afraid to make my own choices, and I know myself
    pretty well. I’m comfortable with who I am and I generally don’t need a lot of outside approval. I keep things
    simple and prefer to live without too much clutter or excess. I’m also sensible with money—I tend to be careful
    about spending and like to save. While I’m good with finances, numbers aren’t really my strong suit, but that
    doesn’t bother me. I have a strong sense of what’s fair, and I value equality and working together. I like being
    part of a group and showing loyalty, but I also appreciate my independence.


    Looking ahead, I aspire to be a totally selfless person. One who gives to others in need regularly. The kind
    of person that I would be proud to be. I feel that I ought to be kind, considerate, and patient, and I should
    always give others a chance to express themselves.'
  36: 'I’ve always been someone who looks out for other people. It’s not about getting anything back—I just love
    that feeling of knowing I made someone’s day a little brighter. If a neighbor needs a hand or a friend is struggling,
    I’m there, no matter what time it is. I’m not interested in rewards or recognition; the satisfaction itself
    is enough.


    I’m also a very practical, organized person. I keep my life in order, pay attention to the details, and follow
    through on what I say I’ll do. I don’t get rattled easily—stress and worry aren’t really part of my makeup.
    I enjoy thinking through problems and learning new things, even if I sometimes overestimate how well I’ll do.
    I’m not afraid of numbers or financial decisions, and I care a lot about the environment.


    I’m very liberal in my politics and strongly believe in equality and helping those who need it. I don’t need
    to stand out or be unique; I’m comfortable with who I am. I’m open to new experiences and ideas, but I also
    like structure and knowing what’s coming next. I’m not impulsive or reckless—I think before I act, and I’m not
    one to take big risks.


    I suppose I’m also a bit of an optimist. I rarely feel down or anxious, and I don’t dwell on negative thoughts.
    I’m social and warm, and people tend to feel at ease around me. At the end of the day, I just want to be kind,
    generous, and useful—and I do my best to live that out every single day.'
  1721: "I’m a married woman in my thirties or forties, living in the Midwest, and I work part-time while raising\
    \ our family of four. I’m a college graduate and I’ve done some postgrad work, but right now my life is a balance\
    \ of home, work, and volunteering. I’m a person who likes order and follow-through—I’m very organized and I\
    \ take my responsibilities seriously, whether that’s keeping up with housework, managing our finances, or helping\
    \ out at church, where I go more than once a week.  \n\nI’m friendly and I genuinely care about making people\
    \ feel valued. I’m the kind of person who puts all my effort and passion into the things I’m involved in. I’m\
    \ patient and kind with my family, and I try to be understanding even when people repeat mistakes and make more\
    \ work for me. I want to be someone who is cheerful and looks on the positive side of everything, and I’m working\
    \ on being more patient and organized than I already am.  \n\nI like to know where I stand and I prefer clear\
    \ answers; ambiguity isn’t my favorite thing. I’m careful with money and don’t like taking risks—I’d rather\
    \ be safe than sorry. I’m good with numbers and financial decisions, and I can think through problems pretty\
    \ carefully, even though I don’t particularly enjoy complicated puzzles for their own sake. I’m not very outgoing,\
    \ and I keep to myself a lot, but with the people close to me, I’m warm and giving. I know who I am, and I’m\
    \ comfortable with that, though I do worry a bit about getting everything done that I expect of myself."
  99: 'I’m self-employed and live on my own in the South. I never married, and I keep things pretty simple. I’m
    not much for crowds or small talk—I’m more of a quiet, steady presence. I’d say I’m generally easygoing and
    cooperative, though I don’t go out of my way to please people or seek their approval. I’m not easily rattled
    or anxious, and I don’t dwell on negative emotions much. I’m pretty sure of who I am, and I don’t feel a strong
    need to stand out or be unique. I’m fine with following along and not making waves, but I do have my own drive.


    I’m not someone who gets excited about abstract puzzles or deep thinking for its own sake—I’d rather deal with
    practical, real-world things. That said, I’m very good with numbers and money, and I know my way around financial
    decisions. I’m careful with risk and prefer a sure thing over a gamble. I also tend to think about money in
    separate buckets, which helps me keep things organized. I’m not particularly drawn to environmental causes,
    and I don’t feel a strong pull toward big social causes either. My empathy toward others is low, and I admit
    I don’t often put myself in other people’s shoes. I’m not very motivated by either chasing success or avoiding
    failure—I just do what needs to be done.


    I want to be confident, patient, and tireless in going after my goals. I think I ought to be consistent, loyal,
    and helpful. And honestly, I am consistent and somewhat confident. I’m very patient and helpful, and I’m steadfast.
    I know myself, and I stick with things.'
  1676: 'I’m a student, and I’ve grown up in the South with a big family. I’m the kind of person who’s very outgoing—I
    genuinely enjoy being around people and can be quite talkative and sociable. But I’m also critical; I don’t
    just go along with things to please others. I have a sharp, logical mind. I love a good puzzle, and I’m the
    type who will spot the hidden trap in a question rather than just going with my gut. I know I’m smarter than
    I give myself credit for, and I certainly think I know more than most other people do.


    I can be pretty impatient, anxious, and a chronic overthinker. I get distracted easily, and since I’ve always
    managed to scrape by with procrastination, it’s become a bad habit that eats into my sleep. When I’m running
    on empty, I’m definitely not calm or level-headed. I know I should take better care of myself, sleep more, and
    try to be more loving and patient with others.


    I’m very driven, though. It’s not about being nice; it’s about achieving and advancing, and I care a lot about
    my own self-interest. I’m not very attached to material things or the latest trends—I can take them or leave
    them. I am careful with my money, maybe even a bit of a tightwad. I don’t take risks with my finances or in
    life.


    I think about the future a lot and I hate waiting. I want things done now, but on my own terms. I don’t really
    care what other people think about me, but I do have a strong sense of duty to my family and community. My ultimate
    goal is to be like my old roommate: totally focused, determined, and able to sacrifice her own desires for a
    higher calling. I want to be that honed in.'
  1692: 'I’m a pretty quiet person by nature, and I don’t go out of my way to be the center of attention or please
    everyone. I do care deeply about people, though, and I’d like to think I’m kind and empathetic. I’m drawn to
    big ideas and thinking things through, but I’ll admit my mind doesn’t always land where I want it to with facts
    or numbers. I’m definitely more of a reflective thinker than a quick one.


    The person I aspire to be is someone who is kind, empathetic, aware, and philanthropic. I want to be independent
    and financially secure, and I want personal success while making the world around me better. I ought to care
    about the health and well-being of not just myself but the world, and I should make a noticeable impact on my
    community and advocate for a better tomorrow. I should be productive and work hard to achieve financial success.


    In reality, I’m someone who often feels anxiety about taking the steps needed to get the results I want. I struggle
    with financial stability, true independence, and the willpower to work long hours or take jobs I don’t like
    just for security. I second-guess myself a lot and feel despair more often than I feel empowered. I have a strong
    sense of what I value—being mindful, protective of the environment, and not needing much—but I have a hard time
    seeing myself clearly. I tend to think in terms of loss and what could go wrong, which I know can hold me back.
    At the end of the day, I’m trying to close the gap between who I am and who I want to be, but it feels like
    a slow, uphill climb.'
  241: 'I’m a pretty quiet and reserved guy—shy, even. I’m not the type to light up a room or go out of my way to
    meet new people, and I’m comfortable with that, though I do sometimes wish I were more sociable. I consider
    myself a moral person, and I genuinely strive to be better, but I’ll be the first to admit I can be studious
    sometimes and lazy other times. I don’t always follow through on things as consistently as I’d like, and discipline
    is something I have to work at.


    I think a lot. I enjoy puzzles and reasoning through problems, and I’m good at spotting when an answer *feels*
    right but is actually wrong. I like learning about all sorts of things and admire people who have great ideas,
    even if coming up with my own is harder for me. I’m not big on ambiguity, though; I’d rather have things figured
    out than left hanging, and I tend to keep to myself in groups rather than stand out.


    Honestly, I’m not a very outgoing or expressive person. I don’t really feel the need to be unique or draw attention,
    and I’m not easily swayed by what others think of me. I prefer things simple and stripped down, both in stuff
    and in daily life. I’m also someone who can be pretty hard on myself at times—I feel down more often than I’d
    like, and I can get anxious. I haven’t hit many of the traditional life milestones yet, so right now I’m just
    trying to find a sense of direction and purpose, and to build the kind of steady, meaningful life I aspire to.'
  2030: 'I’m a caring, compassionate person—that’s the heart of who I am. I love to be of help when I can, but my
    disability and resources currently prevent me from doing what I want, and I’m often more in need of help than
    able to give it. It frustrates me, because I’m not one to sit back. I’m outgoing and warm, the kind of person
    who gets along with just about anyone and genuinely enjoys being around people. I’m also very dependable—once
    I say I’ll do something, I do it, and I like things done right. I don’t get rattled easily; life throws plenty
    at you, and I’ve learned to take it in stride without letting worry get the best of me.


    I like to think I’m pretty clear on who I am and what I value. Other people matter to me deeply—I feel what
    they feel, and I’d rather lift someone up than compete with them. I’m not much for climbing ladders or chasing
    status; I just want to be part of something good and do my part.


    I aspire to be more involved in the corners of my country and my fellow citizens. I want to get some mobility
    back so I can be of help to others and maybe even volunteer sometimes. It’s important to me to do my part in
    life and get involved with charities.


    I ought to be more independent and self-sufficient. I should be able to carry my own weight and not need to
    rely on others too much. That’s what I expect of myself, even if my body doesn’t always cooperate. I’m a Democrat,
    I go to church every week, and I try to live by the Golden Rule—plain and simple.'
  1277: 'I keep to myself mostly. Being around people drains me, and honestly, I get scared and shut down. I’m not
    the outgoing type at all—I’d rather be alone or with just my kids. But I feel things deeply. I can’t watch someone
    struggle without wanting to help, and I care a lot about the environment and living simply. I don’t need a lot
    of stuff, and I try to be practical about money, though I do think a lot before making any choice. I like figuring
    things out, solving puzzles, and thinking through problems carefully—that part of my brain never stops. It’s
    just the dealing-with-people part that paralyzes me.


    I’m separated, self-employed, trying to keep things together for a household of four. The anxiety is constant,
    and the depression weighs on me. I worry all the time about failing, about losing what little I have, about
    not being able to care for my kids. I struggle to even find a job because I’m afraid of interacting with others.
    I know I’m smart—I can reason through abstract things better than most—but that doesn’t help when I can’t even
    make myself pick up the phone.


    I want to be stronger. I want to be independent and outgoing, someone who can handle tasks and deal with people
    without feeling nervous. I want to take my family out of this bad situation and not be terrified about how we’ll
    survive. I should be a better organizer, someone who can help other marginalized people find safety. But right
    now, I’m just trying to get through the day.'
  790: 'I’m a married woman in my fifties, living in the Northeast. I work part-time, but my real focus is building
    up my own business as much as I can. I want to be an entrepreneur in a well-established business that is well
    organized and well known, and I hope to pass it down to my family someday. That’s the dream I’m working toward,
